name: Compilation et tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Compiler et tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurer
        run: dotnet restore Hub.slnx

      - name: Compiler
        run: dotnet build Hub.slnx -c Release --no-restore

      - name: Tester
        run: dotnet test Hub.slnx -c Release --no-build --verbosity normal

      - name: Publier
        run: dotnet publish src/Hub.Web/Hub.Web.csproj -c Release --no-build -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: hub-web
          path: publish
          retention-days: 7
