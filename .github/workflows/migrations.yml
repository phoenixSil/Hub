name: Générer une migration EF Core

# Lancement manuel : crée une migration pour chaque module dont le modèle a changé
# et la dépose comme artefact (à valider puis à commiter).
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Nom de la migration (ex. Initial, AjoutAvis)'
        required: true
        default: 'Initial'

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Installer dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.*

      - name: Compiler
        run: dotnet build Hub.slnx -c Debug

      - name: Générer les migrations
        run: |
          set -e
          add() {
            project=$1; context=$2
            dotnet ef migrations add "${{ github.event.inputs.name }}" \
              --project "$project" --startup-project src/Hub.Web \
              --context "$context" --output-dir Infrastructure/Migrations --no-build || \
            dotnet ef migrations add "${{ github.event.inputs.name }}" \
              --project "$project" --startup-project src/Hub.Web \
              --context "$context" --output-dir Infrastructure/Migrations
          }
          add src/Modules/Platform PlatformDbContext
          add src/Modules/Catalog CatalogDbContext
          add src/Modules/Content ContentDbContext
          add src/Modules/Leads LeadsDbContext
          add src/Modules/Analytics AnalyticsDbContext
          add src/Modules/Channels ChannelsDbContext

      - name: Vérifier que tout compile avec les migrations
        run: dotnet build Hub.slnx -c Debug

      - uses: actions/upload-artifact@v4
        with:
          name: migrations
          path: src/Modules/*/Infrastructure/Migrations/
