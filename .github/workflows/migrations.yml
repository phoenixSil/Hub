name: Générer les migrations EF Core

# Pousser sur la branche « migrations » (ou lancer à la main) : une migration est
# générée pour chaque module, puis commitée sur cette même branche, prête à fusionner.
# Le nom vient du fichier .github/next-migration (sinon un horodatage).
on:
  push:
    branches: [migrations]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrations:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[migrations générées]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Installer dotnet-ef
        run: dotnet tool install --global dotnet-ef --version "10.*"

      - name: Compiler
        run: dotnet build Hub.slnx -c Debug

      - name: Générer les migrations
        run: |
          set -e
          NAME=$(cat .github/next-migration 2>/dev/null || echo "Migration$(date -u +%Y%m%d%H%M)")
          echo "Nom : $NAME"
          for pair in Platform:PlatformDbContext Catalog:CatalogDbContext Content:ContentDbContext Leads:LeadsDbContext Analytics:AnalyticsDbContext Channels:ChannelsDbContext; do
            module=${pair%%:*}; context=${pair##*:}
            dotnet ef migrations add "$NAME" \
              --project "src/Modules/$module" --startup-project src/Hub.Web \
              --context "$context" --output-dir Infrastructure/Migrations --no-build
          done

      - name: Retirer les migrations vides (modules sans changement)
        run: |
          python3 - <<'PY'
          import glob, os, re
          for f in glob.glob('src/Modules/*/Infrastructure/Migrations/*.cs'):
              if f.endswith('.Designer.cs') or f.endswith('ModelSnapshot.cs'):
                  continue
              s = open(f, encoding='utf-8').read()
              m = re.search(r'void Up\(MigrationBuilder migrationBuilder\)\s*\{(.*?)\n        \}', s, re.S)
              if m and 'migrationBuilder.' not in m.group(1):
                  os.remove(f)
                  os.remove(f[:-3] + '.Designer.cs')
                  print('Migration vide supprimée :', f)
          PY
          git status --short

      - name: Vérifier que tout compile avec les migrations
        run: dotnet build Hub.slnx -c Debug

      - name: Commiter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Modules/*/Infrastructure/Migrations
          git commit -m "Migrations EF Core [migrations générées]" || echo "Rien à commiter"
          git push
