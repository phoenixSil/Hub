name: Test de fumée

# Démarre le site avec une vraie base SQL Server, parcourt les pages, envoie un devis,
# se connecte au back-office et publie des captures d'écran sur la branche « apercus ».
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Hub_Smoke_2026!"
        ports:
          - 1433:1433
    env:
      ConnectionStrings__Hub: "Server=localhost,1433;Database=HubSmoke;User Id=sa;Password=Hub_Smoke_2026!;TrustServerCertificate=True;MultipleActiveResultSets=true"
      Hub__AdminEmail: "admin@smoke.test"
      Hub__AdminPassword: "SmokeTest-Password-2026"
      ASPNETCORE_URLS: "http://localhost:5080"
      ASPNETCORE_ENVIRONMENT: "Production"
      Leads__RemindersAnyHour: "true"
      Channels__Simulate: "true"
      Gemini__Simulate: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publier
        run: dotnet publish src/Hub.Web/Hub.Web.csproj -c Release -o publish

      - name: Démarrer le site
        run: |
          (cd publish && nohup dotnet Hub.Web.dll > ../app.log 2>&1 &)
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5080/ || true)
            if [ "$code" = "200" ]; then echo "Site prêt après $i essais"; exit 0; fi
            sleep 2
          done
          echo "::error::Le site n'a pas démarré"
          grep -E "fail|crit|Exception|error" app.log | head -30 | while read -r line; do echo "::error::$line"; done
          exit 1

      - name: Publier les prix (base de test seulement)
        run: |
          SQL=$(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest")
          docker exec "$SQL" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Hub_Smoke_2026!' -d HubSmoke \
            -Q "UPDATE catalog.PricingModels SET IsPublic = 1 WHERE Kind IN ('Hourly','Flat'); SELECT COUNT(*) FROM catalog.PricingModels WHERE IsPublic = 1;"
          # Une demande vieille de 2 jours, pour déclencher le rappel automatique
          docker exec "$SQL" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Hub_Smoke_2026!' -d HubSmoke \
            -Q "INSERT INTO leads.Leads (Id, TenantId, CreatedAt, UpdatedAt, Kind, Status, FullName, Email, ConsentGiven) SELECT NEWID(), Id, DATEADD(day, -2, SYSDATETIMEOFFSET()), DATEADD(day, -2, SYSDATETIMEOFFSET()), 'Quote', 'New', 'Ancienne Demande', 'ancienne@example.com', 1 FROM platform.Tenants;"

      - name: Parcourir les pages et envoyer un devis
        run: python3 .github/smoke/smoke.py http://localhost:5080

      - name: Assistant de devis (proposition automatique)
        run: |
          SQL=$(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest")
          for i in $(seq 1 20); do
            n=$(docker exec "$SQL" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Hub_Smoke_2026!' -d HubSmoke -h -1 -W \
              -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM quotes.Proposals p JOIN leads.Leads l ON l.Id = p.LeadId WHERE l.FullName = 'Test Fumée' AND p.Status = 'Draft' AND p.ProposedTotal > 0;" | tr -d '[:space:]')
            if [ "$n" -ge 1 ] 2>/dev/null; then
              echo "::notice::Proposition préparée automatiquement pour le devis du test"
              docker exec "$SQL" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Hub_Smoke_2026!' -d HubSmoke -W \
                -Q "SELECT Model, EstimatedHours, ProposedTotal, LEFT(LinesJson, 300) AS Lignes, Warnings FROM quotes.Proposals;"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Aucune proposition de l'assistant pour le devis du test"
          grep -iE "proposition|quote" app.log | tail -20 | while read -r line; do echo "::error::$line"; done
          exit 1

      - name: Rappel des demandes en attente
        run: |
          for i in $(seq 1 30); do
            if grep -q "Rappel : 1 demande" app.log; then echo "::notice::Rappel automatique envoyé"; exit 0; fi
            sleep 3
          done
          echo "::error::Le rappel des demandes en attente n'a pas été envoyé"
          exit 1

      - name: Captures d'écran
        if: always()
        run: |
          pip install --quiet playwright==1.49.1
          python3 -m playwright install --with-deps chromium > /dev/null
          python3 .github/smoke/screens.py http://localhost:5080 apercus

      - name: Tests de bout en bout (navigateur)
        if: always()
        working-directory: .github/e2e
        run: python3 e2e.py http://localhost:5080

      - name: Tests visuels (bureau, tablette, mobile)
        if: always()
        working-directory: .github/e2e
        run: python3 visual.py http://localhost:5080 ../../apercus

      - name: Courriel de proposition envoyé
        if: success()
        run: |
          grep -q "votre proposition de prix" app.log && echo "::notice::Courriel de proposition envoyé au client" || { echo "::error::Courriel de proposition absent du journal"; exit 1; }

      - name: Erreurs du journal
        if: always()
        run: |
          grep -E "^(fail|crit)|Unhandled|Exception:" app.log | sort -u | head -40 | while read -r line; do echo "::warning::$line"; done || true

      - name: Publier les captures
        if: always()
        run: |
          [ -d apercus ] || exit 0
          cp app.log apercus/app.log || true
          cd apercus
          git init -q -b apercus
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Captures du test de fumée ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apercus
